version: '3.8'

# =============================================================================
# docker-compose.dokploy.prebuilt.yml
#
# Imágenes pre-buildeadas + MongoDB en el mismo stack (sin Atlas).
#
# Variables en Dokploy > Environment:
#   FRONTEND_IMAGE, BACKEND_IMAGE, MONGO_ROOT_PASSWORD, JWT_SECRET
#   AWS_IOT_* (opcional) + montar certificados en el backend
# =============================================================================

services:
  mongodb:
    image: mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_me_strong_password}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-Arandanos}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh \"mongodb://admin:$$MONGO_INITDB_ROOT_PASSWORD@localhost:27017/?authSource=admin\" --quiet --eval \"db.adminCommand('ping').ok\" || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 40s
    networks:
      - arandanos-network

  backend:
    image: ${BACKEND_IMAGE:-doriajacke/arandanos-backend:latest}
    pull_policy: always
    restart: always
    environment:
      MONGODB_URL: mongodb://admin:${MONGO_ROOT_PASSWORD:-change_me_strong_password}@mongodb:27017/?authSource=admin
      MONGODB_DB: ${MONGODB_DB:-Arandanos}
      SIMULATED_DATA_ENABLED: ${SIMULATED_DATA_ENABLED:-false}
      MAILERSEND_API_TOKEN: ${MAILERSEND_API_TOKEN:-}
      MAILERSEND_FROM_EMAIL: ${MAILERSEND_FROM_EMAIL:-}
      MAILERSEND_FROM_NAME: ${MAILERSEND_FROM_NAME:-Monitoreo Embalse Arandanos}
      MAILERSEND_TO_EMAILS: ${MAILERSEND_TO_EMAILS:-}
      MAILERSEND_TEMPLATE_ID: ${MAILERSEND_TEMPLATE_ID:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_MINUTES_ADMIN: ${JWT_ACCESS_MINUTES_ADMIN:-30}
      JWT_ACCESS_HOURS_EMPLOYEE: ${JWT_ACCESS_HOURS_EMPLOYEE:-8}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      WEBAPP_URL: ${WEBAPP_URL:-}
      API_PORT: 80
      API_HOST: 0.0.0.0
      AWS_IOT_ENABLED: ${AWS_IOT_ENABLED:-false}
      AWS_IOT_ENDPOINT: ${AWS_IOT_ENDPOINT:-a319gtmfe1r2jb-ats.iot.sa-east-1.amazonaws.com}
      AWS_IOT_CLIENT_ID: ${AWS_IOT_CLIENT_ID:-embalse-backend}
      AWS_IOT_TOPIC: ${AWS_IOT_TOPIC:-boya/sensores}
      AWS_IOT_CERT_PATH: /app/iot-certs/4bb52c4252bfb1b205ea09eb59a655000d689f05c3b72aa689f775caa548496e-certificate.pem.crt
      AWS_IOT_KEY_PATH: /app/iot-certs/4bb52c4252bfb1b205ea09eb59a655000d689f05c3b72aa689f775caa548496e-private.pem.key
      AWS_IOT_CA_PATH: /app/iot-certs/AmazonRootCA1.pem
    volumes:
      - ${AWS_IOT_CERTS_DIR:-./IotCore}:/app/iot-certs:ro
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - arandanos-network

  frontend:
    image: ${FRONTEND_IMAGE:-doriajacke/arandanos-frontend:latest}
    pull_policy: always
    restart: always
    depends_on:
      - backend
    expose:
      - "8000"
    networks:
      - arandanos-network

volumes:
  mongodb_data:

networks:
  arandanos-network:
    driver: bridge
