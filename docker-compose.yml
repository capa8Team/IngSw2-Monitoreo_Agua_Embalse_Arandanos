# Monitoreo Embalse Arándanos — stack Docker
#
# Uso típico (Mongo + API + frontend con nginx y proxy /api):
#   docker compose up --build
#
# Frontend: http://localhost:5173  (mapea al puerto 8000 interno del contenedor nginx)
# API directa (desde el host):      http://localhost:8000
#
# Variables opcionales (crear .env en la raíz del repo):
#   JWT_SECRET, MONGO_ROOT_PASSWORD, VITE_SUPABASE_*, VITE_DATA_MODE, etc.

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb-arandanos
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-Panconpalta1}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-Arandanos}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      # Modificado: Se simplificó el ping para asegurar compatibilidad directa con mongosh en la imagen oficial
      test: ["CMD-SHELL", "mongosh --port 27017 --quiet --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 40s
    networks:
      - arandanos-network

  backend:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    container_name: backend-fastapi
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-Panconpalta1}@mongodb:27017/?authSource=admin
      MONGODB_DB: ${MONGODB_DB:-Arandanos}
      SIMULATED_DATA_ENABLED: "${SIMULATED_DATA_ENABLED:-false}"
      API_HOST: 0.0.0.0
      API_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-dev-cambiar-en-produccion-embalse-arandanos}
      JWT_ACCESS_MINUTES_ADMIN: ${JWT_ACCESS_MINUTES_ADMIN:-30}
      JWT_ACCESS_HOURS_EMPLOYEE: ${JWT_ACCESS_HOURS_EMPLOYEE:-8}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:-123456789}
      MAILERSEND_API_TOKEN: ${MAILERSEND_API_TOKEN:-}
      MAILERSEND_FROM_EMAIL: ${MAILERSEND_FROM_EMAIL:-}
      MAILERSEND_FROM_NAME: ${MAILERSEND_FROM_NAME:-Monitoreo Embalse Arandanos}
      MAILERSEND_TO_EMAILS: ${MAILERSEND_TO_EMAILS:-}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_DB_POOLER_URL: ${SUPABASE_DB_POOLER_URL:-}
      SUPABASE_DB_USE_POOLER: ${SUPABASE_DB_USE_POOLER:-}
      SUPABASE_DB_POOLER_REGION: ${SUPABASE_DB_POOLER_REGION:-us-west-2}
      SUPABASE_DB_POOLER_PREFIX: ${SUPABASE_DB_POOLER_PREFIX:-aws-1}
      SUPABASE_DB_HOSTADDR: ${SUPABASE_DB_HOSTADDR:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      LOG_DIR: logs
      AWS_IOT_ENABLED: "${AWS_IOT_ENABLED:-false}"
      AWS_IOT_PORT: ${AWS_IOT_PORT:-8883}
      AWS_IOT_CLIENT_ID: ${AWS_IOT_CLIENT_ID:-embalse-backend}
      AWS_IOT_ENDPOINT: ${AWS_IOT_ENDPOINT:-a319gtmfe1r2jb-ats.iot.sa-east-1.amazonaws.com}
      AWS_IOT_TOPIC: ${AWS_IOT_TOPIC:-boya/sensores}
      AWS_IOT_CERT_PATH: ${AWS_IOT_CERT_PATH:-/app/iot-certs/4bb52c4252bfb1b205ea09eb59a655000d689f05c3b72aa689f775caa548496e-certificate.pem.crt}
      AWS_IOT_KEY_PATH: ${AWS_IOT_KEY_PATH:-/app/iot-certs/4bb52c4252bfb1b205ea09eb59a655000d689f05c3b72aa689f775caa548496e-private.pem.key}
      AWS_IOT_CA_PATH: ${AWS_IOT_CA_PATH:-/app/iot-certs/AmazonRootCA1.pem}
      AWS_IOT_DEFAULT_DEVICE_ID: ${AWS_IOT_DEFAULT_DEVICE_ID:-boya}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    volumes:
      - ${AWS_IOT_CERTS_DIR:-./IotCore}:/app/iot-certs:ro
    ports:
      - "${BACKEND_PORT:-8000}:80"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health', timeout=5)\""]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - arandanos-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # IMPORTANTE: Mapeo explícito de variables para que la compilación de Vite no falle
        VITE_API_URL: "${VITE_API_URL:-}"
        VITE_DATA_MODE: "${VITE_DATA_MODE:-simulated}"
        VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:-}"
        VITE_SUPABASE_ANON_KEY: "${VITE_SUPABASE_ANON_KEY:-}"
    container_name: frontend-arandanos
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:8000"
    healthcheck:
      # Modificado: Se cambió wget por curl o un comando shell básico que evite fallos si alpine no viene con wget completo
      test: ["CMD-SHELL", "cat /dev/null > /dev/tcp/127.0.0.1/8000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - arandanos-network

  database:
    image: postgres:17
    container_name: postgres-arandanos
    profiles:
      - postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./backup_proyecto.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arandanos-network

volumes:
  postgres_data:
  mongodb_data:

networks:
  arandanos-network:
    driver: bridge